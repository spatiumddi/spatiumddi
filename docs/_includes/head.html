<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0f172a">

<link rel="icon" type="image/svg+xml" href="{{ include.root }}assets/logo-icon.svg">
<link rel="stylesheet" href="{{ include.root }}assets/css/site.css">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="https://spatiumddi.github.io/assets/logo.svg">
<meta name="twitter:card" content="summary_large_image">
