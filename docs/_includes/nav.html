<script>
  // Persist an explicit choice; absent one, prefers-color-scheme governs (see
  // site.css). The pre-paint applier lives in _includes/head.html.
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var root = document.documentElement;
      var explicit = root.getAttribute("data-theme");
      var systemDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      var isDark = explicit ? explicit === "dark" : systemDark;
      var next = isDark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try {
        localStorage.setItem("theme", next);
      } catch (e) {
        // Storage unavailable (private mode); the choice still applies for
        // this page view, it just will not survive navigation.
      }
    });
  })();
</script>
