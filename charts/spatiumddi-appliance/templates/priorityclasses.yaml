{{/*
#983 — the appliance's own PriorityClasses.

Before this, every pod on an appliance was Burstable at priority 0, which
makes them indistinguishable to the two rankings that matter when a node
runs out of room:

  * kubelet eviction under memory / ephemeral-storage pressure orders
    victims by priority FIRST, then by usage-over-request. With all
    priorities equal the likeliest victim is whichever pod grew the most —
    on an appliance that is BIND with a warm cache, i.e. the one pod the
    LAN actually needs.

  * scheduler preemption gives a pending pod no claim on a full node, so a
    role DaemonSet landing on a freshly joined node can sit Pending behind
    kube-state-metrics.

Kubernetes' own ``system-cluster-critical`` (2000000000) and
``system-node-critical`` (2000001000) are restricted to ``kube-system`` by
default, hence our own classes. All three sit far below those so k3s's own
components still outrank everything here.

``globalDefault`` is false on all three — a global default would silently
re-rank every pod in every namespace on the cluster, including workloads an
operator joined to it themselves.

#992 — THIS CHART IS INSTALLED TWICE PER APPLIANCE, under two release
names, and these are CLUSTER-SCOPED objects. Helm stamps
``meta.helm.sh/release-name`` on everything it creates and refuses an
install whole when it meets an existing object owned by another release, so
exactly one of the two releases may render them:

  spatium-bootstrap     firstboot → server/manifests/spatium-bootstrap.yaml.
                        supervisor DaemonSet + CNPG operator; every role off.
                        ``priorityClasses.create: true`` — it installs first
                        (the supervisor does not exist until it has run), and
                        firstboot re-renders it from the running slot's baked
                        chart on EVERY boot, so a slot upgrade re-applies it.

  spatiumddi-appliance  the supervisor itself, via
                        service_lifecycle._build_values. The role DaemonSets.
                        ``priorityClasses.create: false`` + ``external: true``.

The original comment here claimed the chart was "installed exactly once per
appliance cluster". It never was, and every fresh install between #988 and
#992 had its role chart refused with ``invalid ownership metadata`` — no
role DaemonSet on the cluster at all, while the Fleet UI showed nothing
wrong because the helm-install job has ``backoffLimit: 1000`` and simply
retried forever.

Ordering still works out because firstboot writes spatium-bootstrap.yaml
immediately and holds spatium-control.yaml back as ``.deferred`` until the
CNPG webhook is ready, so the classes exist before any pod names one.

Deliberately NOT annotated ``helm.sh/resource-policy: keep``, unlike the
CNPG ``Cluster``. ``keep`` would survive the k3s helm-controller's
uninstall+reinstall recovery for a failed release — during which these
objects briefly vanish and no new pod naming one can be created (running
pods are untouched, and the reinstall puts them back seconds later) — but
it also stops Helm patching a kept resource on UPGRADE, so retuning a
class's value would silently do nothing. A few seconds of "cannot create
pods" beats a value that reads as changed and is not.
*/}}
{{/*
Guard the combination that stops the appliance dead: workloads naming a
class that nothing will create. The apiserver REFUSES a pod naming a
PriorityClass that does not exist, so it does not degrade the appliance —
no role pod and no supervisor is created at all, with the reason buried in
a DaemonSet event.

``create: false`` alone is no longer enough to conclude that, since #992
made a second release the legitimate owner. Two ways to satisfy the guard:

  external: true   an explicit assertion that some other release or
                   manifest creates them. Deterministic, and the only form
                   that works under ``helm template`` / ``helm lint`` /
                   charts-lint, where there is no cluster to ask. This is
                   what the supervisor sets.

  the class exists  ``lookup`` against the live apiserver, for values an
                   operator hand-rolled without setting ``external``.
                   ``lookup`` is live inside the k3s helm-controller job
                   (it runs a real ``helm install``), and returns empty
                   under ``helm template`` — which is why ``external`` has
                   to exist at all rather than this being the only test.

Named rather than counted, so the message says what to clear.
*/}}
{{- if not .Values.priorityClasses.create }}
{{- $named := dict -}}
{{- range $key, $wl := .Values -}}
{{- if kindIs "map" $wl -}}
{{- $class := get $wl "priorityClassName" -}}
{{- if $class -}}
{{- $_ := set $named $class (printf "%s.priorityClassName" $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $named (not .Values.priorityClasses.external) -}}
{{- $missing := list -}}
{{- range $class, $where := $named -}}
{{- if not (lookup "scheduling.k8s.io/v1" "PriorityClass" "" $class) -}}
{{- $missing = append $missing (printf "%s (named by %s)" $class $where) -}}
{{- end -}}
{{- end -}}
{{- if $missing -}}
{{- fail (printf "priorityClasses.create is false and these classes are not on the cluster: %s. A pod naming a PriorityClass that does not exist is REFUSED by the apiserver, so this render would produce workloads that can never be created. Fix one of three ways: leave create: true; set priorityClasses.external=true if another release (spatium-bootstrap) creates them and this render simply cannot see the cluster; or set each priorityClassName to \"\" as well." (join ", " $missing)) -}}
{{- end -}}
{{- end -}}
{{- end }}
{{- if .Values.priorityClasses.create }}
{{- range $key, $class := .Values.priorityClasses.classes }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $class.name }}
  labels:
    {{- include "spatiumddi-appliance.labels" $ | nindent 4 }}
value: {{ $class.value }}
globalDefault: false
{{- if $class.preemptionPolicy }}
preemptionPolicy: {{ $class.preemptionPolicy }}
{{- end }}
description: {{ $class.description | quote }}
{{- end }}
{{- end }}
