name: Build appliance builder image

# The OS-appliance build container. Bumping mkosi or any of the tools
# under `appliance/builder/Dockerfile` republishes the image at
# ghcr.io/spatiumddi/appliance-builder:latest, which is what
# `make appliance` (laptop) and the release pipeline (CI) both pull.

on:
  push:
    branches: [main]
    paths:
      - 'appliance/builder/**'
      - '.github/workflows/build-appliance-builder.yml'
  pull_request:
    paths:
      - 'appliance/builder/**'
      - '.github/workflows/build-appliance-builder.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    # Forks inherit this workflow (#830); never push the builder image
    # outside the canonical repo. PRs to us run here anyway (the base
    # repo's owner matches), so contributor scan builds are unaffected.
    if: github.repository_owner == 'spatiumddi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build + push (main)
        uses: docker/build-push-action@v7
        with:
          context: appliance/builder
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/spatiumddi/appliance-builder:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
