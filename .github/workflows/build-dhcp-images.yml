name: Build DHCP Agent Images

# TRIGGERS — deliberately PR-only. Neither `push` case earned its keep:
#
#   on a TAG, this raced release.yml's build-dhcp,
#     which builds the same image and pushes the SAME `:<VERSION>` tag.
#     Two multi-arch builds of identical source, concurrently, with the
#     winner decided by whichever finished last — on a release artifact.
#
#   on `main`, it published `:main` and `:sha-<short>` that nothing
#     consumes: no chart, no compose file, no k8s manifest pins them, and
#     agent-e2e explicitly builds from PR source instead (see the comment
#     in agent-e2e.yml). It also skipped Trivy on that path, so it was
#     publishing unscanned multi-arch images for no reader.
#
# What replaced each: releases are built by release.yml, and "build main
# periodically" is nightly.yml (#805) — which does it once a day with a
# Trivy gate ahead of the push, rather than on every merge with none.
#
# The PR trigger below is the one that matters and is unchanged: it is the
# CVE gate, and it still blocks the PR on any fixable HIGH/CRITICAL.
on:
  pull_request:
    paths:
      - "agent/dhcp/**"
  workflow_dispatch:

# Read-only (#1022): this workflow builds and scans, it never publishes.
# Publishing is release.yml (tags, multi-arch) and nightly.yml (main).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [kea]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # #1022 — this used to be one of two build steps, the other a multi-arch
      # push gated on ``event_name != 'pull_request'``. The triggers are PR +
      # workflow_dispatch only (see docs/DEVELOPMENT.md, trigger policy), so that
      # step was reachable solely by hand and pushed ``:<branch>`` / ``:sha-*``
      # tags nothing consumes. release.yml and nightly.yml own publishing.
      - name: Build (single-arch, load locally for Trivy)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/dhcp/images/${{ matrix.flavor }}/Dockerfile
          # Single-arch on PR: ``--load`` only accepts one platform,
          # and the runner is amd64. Release builds (push branch) do
          # the multi-arch manifest list.
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/spatiumddi/dhcp-${{ matrix.flavor }}:pr-scan
          cache-from: type=gha,scope=dhcp-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=dhcp-${{ matrix.flavor }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          # Reference the locally-loaded image from the PR build
          # step above. Same fix as build-dns-images.yml — the
          # previous ``ghcr.io/...:${{ github.sha }}`` reference
          # never resolved (metadata-action emits ``sha-<short>``,
          # not raw full SHAs, and on PR nothing gets pushed) so
          # Trivy 404'd with MANIFEST_UNKNOWN.
          image-ref: ghcr.io/spatiumddi/dhcp-${{ matrix.flavor }}:pr-scan
          format: table
          severity: HIGH,CRITICAL
          # Fail the PR on any HIGH/CRITICAL CVE that has a fix
          # available — `ignore-unfixed: true` keeps us unblocked on
          # vulns that have no upstream patch yet (base image issues
          # we can't fix locally). Flip back to "0" for a one-off
          # ignore if a new CVE lights up without a fix release.
          exit-code: "1"
          ignore-unfixed: true
