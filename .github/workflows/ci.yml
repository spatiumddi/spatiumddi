name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ``paths-ignore`` is deliberately absent. Skipped workflow runs
  # don't post the required check-runs the ``protect-main`` ruleset
  # waits for, so docs-only PRs (CHANGELOG bumps, README polish,
  # release-prep PRs) sit BLOCKED forever even though every code
  # check would be a no-op.
  #
  # #813 gets the runtime back without that trade: the workflow still
  # ALWAYS runs and always posts every check, and the expensive part
  # (8 backend test shards, each with its own Postgres + Redis) is
  # gated per-JOB on change detection instead. A docs-only PR now
  # posts a green "Backend — Tests" in seconds rather than minutes,
  # and no ruleset knows the difference.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Change detection (issue #813) ──────────────────────────────────────────
  # Cheap (~15 s) job whose only output decides whether the 8 backend test
  # shards run. Everything else in this workflow is unconditional.
  #
  # Deliberately NOT ``dorny/paths-filter``: a plain git diff needs no
  # third-party action in the supply chain for something this small, and it
  # sidesteps that action's base-ref handling on non-PR events.
  #
  # The matching itself lives in ``.github/scripts/ci-backend-relevant.sh`` so
  # it can be tested without pushing a branch — see
  # ``backend/tests/test_ci_backend_relevant.py``. Read that script's header
  # before changing the path list; the deny-list shape is load-bearing.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is taken against the PR's merge base, so both sides of
          # the history have to be present.
          fetch-depth: 0

      - id: detect
        name: Does this change set need the backend suite?
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Push to main runs the full suite unconditionally: it is the
          # post-merge safety net, and a squash-merge's diff is not the
          # thing we filtered on when the PR was open.
          if [ "$EVENT" != "pull_request" ]; then
            echo "event=$EVENT — running the full backend suite"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots: changes on the head branch since the merge base, not
          # everything main has moved on by.
          #
          # ``--no-renames`` is load-bearing. With rename detection on (the
          # default) ``git mv backend/thing.py docs/thing.md`` reports ONLY
          # the destination — so a PR that deletes a backend file by moving
          # it out of the tree would look docs-only and skip the whole suite.
          # We want both sides of every rename in the list.
          changed="$RUNNER_TEMP/changed-files.txt"
          if ! git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$changed"; then
            echo "::warning::could not diff $BASE_SHA...$HEAD_SHA — running the full backend suite"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          sed 's/^/  /' "$changed"

          relevant="$(.github/scripts/ci-backend-relevant.sh < "$changed")"
          echo "backend=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "true" ]; then
            echo "→ backend suite WILL run"
          else
            echo "→ nothing the backend suite covers changed; shards will be skipped"
          fi

  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check app tests

      - name: black check
        run: python -m black --check app tests

      - name: mypy
        run: python -m mypy app

      # Stops the untyped-response-schema class from growing (issue #917).
      # A route with no response_model publishes an unconstrained object, so a
      # generated client gets a dictionary instead of a model — the same
      # silent drift #907 fixed for nullable properties. 91 routes were in
      # that state when the guard landed; the checked-in baseline may shrink,
      # never grow. Extraction imports the app, which this job already has
      # installed, so no container is needed here.
      - name: Untyped-route guard
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/lint_untyped_routes.py --list > /tmp/untyped-routes.txt
          python3 scripts/lint_untyped_routes.py --check /tmp/untyped-routes.txt

      # Enforces the expand/contract migration contract (issue #296).
      # Every Alembic migration must be safe against BOTH N-1 and N
      # application code during the rolling-upgrade mixed-version
      # window. The linter is stdlib-only and runs from repo root, so
      # the ``working-directory: backend`` default is overridden here.
      - name: Migration-shape linter
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lint_migrations.py

      # Guards the appliance host-side runner scripts (issues #550/#553):
      # every systemd ExecStart runner must be executable in the built
      # image (git +x OR chmod'd in mkosi.postinst) and bash -n clean.
      # Catches the class of bug where a shipped feature is dead because
      # its runner hit 203/EXEC. stdlib-only; runs from repo root.
      - name: Appliance runner linter
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lint_appliance_runners.py

  # The ~1900-test suite is DB-bound, so we fan it out across 8 parallel
  # jobs (free concurrent runners) via pytest-split; each job still runs
  # ``-n auto`` (4 xdist workers on a 4-vCPU runner) → ~32-way parallelism
  # total, taking the wall-clock from ~18 min to ~3 min. Coverage is no
  # longer collected on the PR gate (it was a non-gating ``continue-on-error``
  # upload anyway and added ~15-30% tracing overhead on every run).
  backend-test-shard:
    name: Backend — Tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # #813 — skipped when the PR touches nothing the suite covers. The
    # aggregator below stays green in that case, so no required check
    # notices. ``changes`` failing leaves this skipped too, and the
    # aggregator treats THAT as a failure (it only accepts a skip that
    # detection explicitly asked for).
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spatiumddi
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spatiumddi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://spatiumddi:test@localhost:5432/spatiumddi_test
        run: alembic upgrade head

      - name: Run tests (shard ${{ matrix.shard }} of 8)
        env:
          DATABASE_URL: postgresql+asyncpg://spatiumddi:test@localhost:5432/spatiumddi_test
          # conftest reads its own TEST_DATABASE_URL (defaults to "changeme")
          TEST_DATABASE_URL: postgresql+asyncpg://spatiumddi:test@localhost:5432/spatiumddi_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: ci-test-secret-key-not-for-production
        # ``--splits 8 --group N`` (pytest-split) selects this shard's slice
        # of the suite (even split by test count when no .test_durations file
        # is present); ``-n auto`` then runs that slice across the runner's
        # 4 vCPUs, each xdist worker on its own ``spatiumddi_test_gw<N>`` DB.
        run: python -m pytest -n auto --splits 8 --group ${{ matrix.shard }}

  # Aggregator that collapses the 8 shards into one stable check name,
  # "Backend — Tests". Not currently in ``protect-main``'s required set (only
  # the two Frontend jobs and Backend Lint are) but it is the name to point at
  # if it ever is — which is precisely why the skip logic lives HERE and never
  # on the shards' own check names.
  #
  # #813: a skip is a pass, but only the skip detection asked for.
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: [changes, backend-test-shard]
    if: always()
    steps:
      - name: All shards passed
        env:
          SHARDS: ${{ needs.backend-test-shard.result }}
          BACKEND_RELEVANT: ${{ needs.changes.outputs.backend }}
        run: |
          set -euo pipefail

          if [ "$SHARDS" = "skipped" ]; then
            # Only an explicit "false" justifies a skip. An empty value means
            # the ``changes`` job itself failed or was cancelled, which took
            # the shards down with it — that is a broken run, not a clean one,
            # and must not report green.
            if [ "$BACKEND_RELEVANT" != "false" ]; then
              echo "::error::shards were skipped but change detection did not ask for it (backend='$BACKEND_RELEVANT')"
              exit 1
            fi
            echo "no backend-relevant files changed — 8 shards skipped (#813)"
            exit 0
          fi

          if [ "$SHARDS" != "success" ]; then
            echo "::error::backend test shards did not all pass (result=$SHARDS)"
            exit 1
          fi
          echo "all 8 backend test shards passed"

  # ── Frontend ───────────────────────────────────────────────────────────────
  # ── Docs ───────────────────────────────────────────────────────────────────
  # The published docs embed hand-authored SVG diagrams. Their text is placed
  # by absolute coordinate, so a relabelled box silently spills out of its
  # container or off the canvas — invisible in a diff, obvious on the site.
  # This renders each one in headless Chrome and measures real text metrics.
  docs-diagrams:
    name: Docs — Diagram Geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ubuntu-latest ships Google Chrome preinstalled, which the script
      # finds on its own. Install chromium only if that ever stops being
      # true — apt on a runner without it would otherwise fail the job for
      # a reason unrelated to the diagrams.
      - name: Ensure a headless browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 \
             && ! command -v chromium >/dev/null 2>&1 \
             && ! command -v chromium-browser >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y chromium
          fi

      - name: Verify diagram geometry
        run: python3 scripts/verify_svg_diagrams.py

  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      # #906 — the frontend had no test runner at all. Added with the
      # enrolment QR because that code is verified by DECODING what it
      # renders: a transposed row/column or an inverted polarity produces a
      # QR that looks perfectly normal and scans as nothing, which no amount
      # of review or type-checking catches. Lives in this job rather than a
      # new one so it reuses the install above — the suite is <1 s.
      - name: Vitest
        run: npm test

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # ── Agents ───────────────────────────────────────────────────────────────────
  # The standalone agents (DNS / DHCP / supervisor) each ship their own test
  # suite under ``agent/<name>/tests`` but were never run in CI — ``ci.yml``
  # only ever touched ``backend`` + ``frontend`` (issue #640). That let
  # ``agent/supervisor`` sit RED on main undetected, which in turn hid a real
  # production bug (the ``PeerResolveWatcher`` ``AttributeError`` on the
  # bootstrap-from-cache path — see #640). These suites are DB-less and fast
  # (~1-2 s each), so running them on every PR is nearly free.
  #
  # NOTE: agent code is NOT yet lint-checked (Backend Lint scopes to
  # ``backend/app`` + ``backend/tests``) and carries pre-existing ruff/black
  # drift, so this job runs *tests only*. Bringing agent code under lint is a
  # separate, larger cleanup (~30 files of black reformatting) deliberately
  # left out of #640 to keep this change focused.
  agent-test-shard:
    name: Agent — Tests (${{ matrix.agent }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [dhcp, dns, supervisor]
    defaults:
      run:
        working-directory: agent/${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/${{ matrix.agent }}/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        # The ``@pytest.mark.e2e`` acceptance tests self-``skip()`` when their
        # docker/live-daemon prerequisites are absent, so a plain ``pytest``
        # run stays hermetic (no database, no network) — see each agent's
        # ``tests/test_acceptance.py``.
        run: python -m pytest tests -q

  # ── Appliance ────────────────────────────────────────────────────────────────
  # ``appliance/tests`` has ~194 host-portable cases covering the installer's
  # GRUB rendering, host migration, slot upgrades, cluster-join guards, the
  # ``--check-preseed`` linter (#581) and the preseed security guards (#581) —
  # and none of them ran in CI. Same gap #640 found for the agent suites: a
  # suite nobody runs is a suite that goes red unnoticed, and #549 is a
  # disk-*wiping* feature, so its guards are exactly the ones that must not
  # regress silently.
  #
  # Deliberately hermetic: no root, no block devices, no Docker, no database.
  # The only runtime dependency beyond pytest is PyYAML, which
  # ``spatium-preseed-parse`` imports (the appliance image ships
  # python3-yaml). Whole suite is ~10 s.
  #
  # Like the agent job above, this runs *tests only* — appliance scripts are
  # not under ruff/black (Backend Lint scopes to ``backend/``), and the two
  # pre-existing shellcheck findings in ``spatium-install`` (SC2010 / SC2034)
  # are out of scope here.
  appliance-test:
    name: Appliance — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pyyaml

      - name: Run tests
        run: python -m pytest appliance/tests -q

  # ── Helm charts (#966) ──────────────────────────────────────────────────────
  # Nothing on a PR used to parse either chart: the one PR-time helm job
  # (agent-e2e) is path-filtered to ``charts/spatiumddi/**`` and installs only
  # the umbrella chart, so ``charts/spatiumddi-appliance/`` was first read by
  # helm during ``release.yml``'s ``helm package`` — a template that failed to
  # render broke the RELEASE, not the PR that introduced it — and no job ran
  # ``helm lint`` at all. #953 (three chart files) went green on 17 checks,
  # none of which opened a file it changed.
  #
  # The gate lives in ``.github/scripts/charts-render-check.sh`` so ``make
  # charts-lint`` runs the identical thing locally: helm lint, helm template
  # with every role / feature toggle ON, kubeconform -strict against the K8s
  # + CRD schemas, and a no-BestEffort check on the appliance renders (#965).
  # Unconditional like every other job here — see the header on why ``paths``
  # filters are absent — and ~1 min.
  charts-lint:
    name: Charts — Lint & Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2

      - name: Install kubeconform
        run: .github/scripts/install-kubeconform.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Cache kubeconform schemas
        # kubeconform caches fetched schemas only in memory, per invocation;
        # persisting its disk cache means a steady-state PR fetches nothing
        # from raw.githubusercontent.com — the job's only flake source.
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kubeconform-schemas
          key: kubeconform-schemas-v0.8.0-k8s-1.31.0-${{ hashFiles('.github/scripts/charts-render-check.sh') }}

      - name: Lint, render and validate both charts
        env:
          OUT: ${{ runner.temp }}/charts
          KUBECONFORM_CACHE: ${{ runner.temp }}/kubeconform-schemas
        run: |
          mkdir -p "$OUT"
          .github/scripts/charts-render-check.sh

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-charts
          path: ${{ runner.temp }}/charts
          retention-days: 7

  # ── Perf tooling (#968) ─────────────────────────────────────────────────────
  # ``perf/`` — the off-box load generators + campaign harness the appliance
  # sizing work runs on — was referenced by no workflow, so its tests never
  # ran (#955 merged on 25 green checks that opened none of its files) while
  # the backend path filter, which did not know ``perf/`` either, spent all 8
  # backend shards on it. Hermetic: the tests use a fake socket, no network,
  # no appliance, ~0.01 s.
  #
  # Tests only, like the agent + appliance jobs: ``perf/`` is outside the
  # Backend Lint scope and carries pre-existing ruff/black drift (25 findings,
  # 39 of 42 files black would reformat, measured 2026-09-04) — bringing it
  # under lint is a formatting-only change of its own.
  perf-test:
    name: Perf — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest perf -q

  # Required-status-check aggregator: branch protection can gate on the stable
  # name "Agent — Tests"; this job passes only if all three agent suites did.
  # Keep this name (and the matrix above) in sync with the required check.
  agent-test:
    name: Agent — Tests
    runs-on: ubuntu-latest
    needs: [agent-test-shard]
    if: always()
    steps:
      - name: All agent suites passed
        run: |
          result="${{ needs.agent-test-shard.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::one or more agent test suites failed (result=$result)"
            exit 1
          fi
          echo "all agent test suites passed"
