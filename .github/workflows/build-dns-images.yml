name: Build DNS Agent Images

# TRIGGERS — deliberately PR-only. Neither `push` case earned its keep:
#
#   on a TAG, this raced release.yml's build-dns / build-dns-powerdns / build-dns-technitium / build-dns-dnsdist,
#     which builds the same image and pushes the SAME `:<VERSION>` tag.
#     Two multi-arch builds of identical source, concurrently, with the
#     winner decided by whichever finished last — on a release artifact.
#
#   on `main`, it published `:main` and `:sha-<short>` that nothing
#     consumes: no chart, no compose file, no k8s manifest pins them, and
#     agent-e2e explicitly builds from PR source instead (see the comment
#     in agent-e2e.yml). It also skipped Trivy on that path, so it was
#     publishing unscanned multi-arch images for no reader.
#
# What replaced each: releases are built by release.yml, and "build main
# periodically" is nightly.yml (#805) — which does it once a day with a
# Trivy gate ahead of the push, rather than on every merge with none.
#
# The PR trigger below is the one that matters and is unchanged: it is the
# CVE gate, and it still blocks the PR on any fixable HIGH/CRITICAL.
on:
  pull_request:
    paths:
      - "agent/dns/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dnsdist (#146 Phase 2) and technitium follow the same image path
        # convention (agent/dns/images/<flavor>/Dockerfile →
        # ghcr.io/spatiumddi/dns-<flavor>).
        flavor: [bind9, powerdns, technitium, dnsdist]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/spatiumddi/dns-${{ matrix.flavor }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build (PR — single-arch, load locally for Trivy)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/dns/images/${{ matrix.flavor }}/Dockerfile
          # Single-arch on PR: ``--load`` only accepts one platform,
          # and the runner is amd64, so this is what fits in the
          # local docker daemon. The release builds (push branch) do
          # the multi-arch manifest list.
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/spatiumddi/dns-${{ matrix.flavor }}:pr-scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dns-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=dns-${{ matrix.flavor }}

      - name: Build and push (main / tag — multi-arch, push to ghcr)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/dns/images/${{ matrix.flavor }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dns-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=dns-${{ matrix.flavor }}

      # Issue #734 — the only automated proof that a zone transfer is
      # permitted for a TSIG-signed request and refused for everything
      # else. It runs against the image just built, so it exercises the
      # real agent renderer and the real pinned BIND together on a socket;
      # a unit test can only show we emit the string we intended, not that
      # named reads it the way we believe.
      #
      # It lives here rather than in agent-e2e.yml because this job already
      # loads the image locally for Trivy, and because the kind workflow
      # only ever ran a `dig version.bind CH TXT` liveness smoke. Before
      # this step, `grep -rl axfr .github/workflows` matched NOTHING, while
      # test_acceptance.py's AXFR test was a permanent skip whose docstring
      # claimed coverage lived in agent-e2e.yml. That false claim is a large
      # part of why #61's drift report shipped broken and stayed broken.
      #
      # The script never skips: a missing prerequisite exits non-zero,
      # because "the check quietly didn't run" is the failure being fixed.
      - name: TSIG zone-transfer check (bind9)
        if: github.event_name == 'pull_request' && matrix.flavor == 'bind9'
        run: |
          docker run --rm \
            -v "$PWD/agent/dns/tests:/checks:ro" \
            --entrypoint python3 \
            ghcr.io/spatiumddi/dns-bind9:pr-scan /checks/live_axfr_check.py

      - name: Trivy scan
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          # Reference the locally-loaded image from the PR build
          # step above. Previously this referenced
          # ``ghcr.io/...:${{ github.sha }}`` which is never produced
          # — metadata-action emits ``sha-<short>``-prefixed tags,
          # not raw full SHAs, and on PR the image isn't pushed at
          # all. Trivy resolved the missing tag against ghcr and
          # blew up with MANIFEST_UNKNOWN.
          image-ref: ghcr.io/spatiumddi/dns-${{ matrix.flavor }}:pr-scan
          format: table
          severity: HIGH,CRITICAL
          # Fail the PR on any HIGH/CRITICAL CVE that has a fix
          # available — `ignore-unfixed: true` keeps us unblocked on
          # vulns that have no upstream patch yet (base image issues
          # we can't fix locally). Flip back to "0" for a one-off
          # ignore if a new CVE lights up without a fix release.
          exit-code: "1"
          ignore-unfixed: true
