# Per-architecture appliance packages — arm64 / AArch64 (#1026).
#
# **UEFI only, and that is not a simplification — it is the platform.**
# There is no i386-pc GRUB target for AArch64 and no BIOS to chain-load
# from: Apple Virtualization, UTM, AWS Graviton and every Raspberry
# Pi 5-class board with a UEFI firmware all boot EFI. So there is no
# grub-pc-bin here, no BIOS-boot partition in the installer's layout,
# and ``BiosBootloader=none`` rather than a grub that has nowhere to go.
#
# The consequence worth knowing: on arm64 the installer's #995
# firmware detection collapses from "BIOS or UEFI, and which one did
# the live ISO boot from" to "UEFI, or refuse" — a machine that cannot
# boot EFI cannot run this image at all, and saying so at install time
# is better than a successful install that never boots.

[Match]
Architecture=arm64

[Content]
BiosBootloader=none
Packages=
        linux-image-arm64
        grub-efi-arm64-bin
