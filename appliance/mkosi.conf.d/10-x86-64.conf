# Per-architecture appliance packages — x86-64 (#1026).
#
# Split out of mkosi.conf so the same tree builds either architecture.
# Everything here is the status quo ante: an x86-64 build produces a
# byte-identical package set to the one that shipped before the split.
#
# Hybrid BIOS + UEFI is x86-64 ONLY. The appliance is expected to boot
# on Proxmox / libvirt / VMware with default (SeaBIOS) firmware, which
# is why grub-pc-bin and the BIOS-boot partition exist at all.

[Match]
Architecture=x86-64

[Content]
BiosBootloader=grub
Packages=
        linux-image-amd64
        grub-pc-bin
        grub-efi-amd64-bin
