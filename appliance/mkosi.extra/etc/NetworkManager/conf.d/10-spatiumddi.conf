# SpatiumDDI appliance NetworkManager defaults.
#
# `dns=systemd-resolved` keeps systemd-resolved as the authoritative
# manager of /etc/resolv.conf — NM hands per-interface DNS info to
# resolved over D-Bus rather than touching the file directly. Same
# end-state as the previous systemd-networkd stack: applications
# resolve through 127.0.0.53 (when DNSStubListener=yes) or via the
# /run/systemd/resolve/resolv.conf symlink (we use the latter, set
# in mkosi.postinst, because the appliance's BIND9 container needs
# the host's :53 free).
#
# `plugins=keyfile` is the modern default — keyfile-formatted
# connections live under /etc/NetworkManager/system-connections/.
# The installer (spatium-install) writes a static-IP override into
# that directory when the operator picks "static" in the wizard.
[main]
dns=systemd-resolved
plugins=keyfile

# Keep the interface configured through a carrier loss (#1084).
#
# Stock NetworkManager deactivates a profile the moment its link drops
# (``device (enp1s0): state change: activated -> unavailable (reason
# 'carrier-changed')``) and withdraws the address and the default route
# with it. On a cluster member that turns a cable flap or a switch reboot
# into a k3s crash loop: k3s exits on the coordination lease it can no
# longer renew (stock k3s behaviour, ~15-55 s in), and every 5 s systemd
# restart after that dies at once on ``no default routes found in
# "/proc/net/route"`` until the link is back -- 13-15 unit failures per
# ~70 s partition on the nightly QA rigs, and a member that cannot even
# start k3s while it is cut off. With the carrier ignored the address and
# the route stay in place (the kernel keeps the route, flagged ``linkdown``),
# the restarted k3s comes up and waits on etcd, and the member rejoins the
# moment the carrier returns.
#
# ``ignore-carrier`` in a ``[device*]`` section is a boolean scoped by
# ``match-device`` (the ``[main] ignore-carrier=<list>`` spelling is the
# deprecated form). Ethernet only: the cni/flannel veths are unmanaged
# and a loopback never has a carrier to ignore. A DHCP profile still needs
# a link to lease from at boot, and a lease is renewed on link-up exactly as
# before; only the tear-down on carrier loss goes away.
[device-spatiumddi-ethernet-carrier]
match-device=type:ethernet
ignore-carrier=yes
